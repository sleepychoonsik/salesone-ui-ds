<!doctype html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.cv svg{position:absolute;left:480px;top:0}
.brand{fill:var(--brand)}.ink{fill:var(--fg)}.tint{fill:var(--bg-secondary)}.caution{fill:var(--cautionary)}
.box{fill:var(--bg);stroke:var(--line);stroke-width:1.5}.on{fill:var(--brand)}.tick{fill:none;stroke:var(--on-brand);stroke-width:2.5}
.r16{rx:var(--radius-16)}.r12{rx:var(--radius-12)}.r5{rx:var(--radius-5)}
.txt{position:absolute;left:48px;bottom:40px;max-width:440px}
.nm{margin:0;font-size:88px;line-height:.95;font-weight:700;letter-spacing:-.03em;color:var(--fg)}
.tg{margin:16px 0 0;font-size:14px;line-height:20px;color:var(--fg-tertiary)}
</style></head><body>
<div class="cv">
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
<!-- blocks: brand 232×200 (r16, panel radius) · ink 152×112 (r16) · tint 152×80 (r12) · caution 72×72 (r12, the only state colour, small)
     arrangement: one tall brand slab bleeding off the top, ink and tint stacked right of it, caution tucked low — the floating panel over the page
     pattern: a 4×3 grid of 20px checkboxes (r5, 32px pitch = control-sm) across the slab, five checked in on-brand — "고른 것만 처리한다", the panel's pick-rows gesture
     scales: radius-16 / radius-12 / radius-5, gaps space-16 (16) and space-8 multiples, pitch 32 = control-sm -->
<rect class="brand r16" x="24" y="-24" width="232" height="224"/>
<rect class="ink r16" x="272" y="-16" width="168" height="128"/>
<rect class="tint r12" x="272" y="128" width="168" height="80"/>
<rect class="caution r12" x="184" y="216" width="72" height="72"/>
<g>
 <rect class="box r5" x="56" y="40" width="20" height="20"/><rect class="on r5" x="88" y="40" width="20" height="20" style="stroke:var(--on-brand);stroke-width:1.5"/><rect class="box r5" x="120" y="40" width="20" height="20"/><rect class="box r5" x="152" y="40" width="20" height="20"/>
 <rect class="box r5" x="56" y="72" width="20" height="20"/><rect class="box r5" x="88" y="72" width="20" height="20"/><rect class="on r5" x="120" y="72" width="20" height="20" style="stroke:var(--on-brand);stroke-width:1.5"/><rect class="on r5" x="152" y="72" width="20" height="20" style="stroke:var(--on-brand);stroke-width:1.5"/>
 <rect class="on r5" x="56" y="104" width="20" height="20" style="stroke:var(--on-brand);stroke-width:1.5"/><rect class="box r5" x="88" y="104" width="20" height="20"/><rect class="box r5" x="120" y="104" width="20" height="20"/><rect class="on r5" x="152" y="104" width="20" height="20" style="stroke:var(--on-brand);stroke-width:1.5"/>
 <path class="tick" d="M93 50l4 4 7-8M125 82l4 4 7-8M157 82l4 4 7-8M61 114l4 4 7-8M157 114l4 4 7-8"/>
</g>
</svg>
<div class="txt"><p class="nm">세일즈원<br>자동화 UI</p><p class="tg">n세일즈원 위에 뜨는 자동화 패널의 공통 디자인 시스템</p></div>
</div>
</body></html>
